[package]
name = "trailsplice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
